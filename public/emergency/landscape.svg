<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="100%" height="100%" fill="#030a14"/><path d="M80 340H1840" stroke="#d4a333" stroke-width="3" opacity=".6"/><g font-family="Georgia,serif" font-style="italic" font-weight="900" fill="#f9f0da"><text x="80" y="280" font-size="56">Malam Manifesto</text><text x="80" y="440" font-size="32" fill="#ddb45b" font-style="normal" font-family="sans-serif" letter-spacing="8">GANGGUAN TEKNIKAL</text><text x="80" y="540" font-size="64">Kami akan kembali sebentar lagi.</text><text x="80" y="630" font-size="36" fill="#8fa3c1" font-style="normal" font-family="sans-serif">Terima kasih kerana menunggu.</text><text x="80" y="980" font-size="28" fill="#8fa3c1" font-style="normal" font-family="sans-serif">Kandungan pendidikan sahaja. Bukan nasihat kewangan.</text></g></svg>
