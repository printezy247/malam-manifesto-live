<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="100%" height="100%" fill="#030a14"/><path d="M60 300H1020" stroke="#d4a333" stroke-width="3" opacity=".6"/><g font-family="Georgia,serif" font-style="italic" font-weight="900" fill="#f9f0da"><text x="60" y="230" font-size="64">Malam Manifesto</text><text x="60" y="420" font-size="34" fill="#ddb45b" font-style="normal" font-family="sans-serif" letter-spacing="8">GANGGUAN TEKNIKAL</text><text x="60" y="540" font-size="72">Kami akan kembali sebentar lagi.</text><text x="60" y="650" font-size="38" fill="#8fa3c1" font-style="normal" font-family="sans-serif">Terima kasih kerana menunggu.</text><text x="60" y="1800" font-size="30" fill="#8fa3c1" font-style="normal" font-family="sans-serif">Kandungan pendidikan sahaja. Bukan nasihat kewangan.</text></g></svg>
